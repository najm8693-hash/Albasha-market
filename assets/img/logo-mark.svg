<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="متجر الباشا">
  <title>متجر الباشا — Albasha Market</title>
  <defs>
    <linearGradient id="albasha-gold" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#f2d488" />
      <stop offset="1" stop-color="#b07a16" />
    </linearGradient>
  </defs>

  <!-- أرضية داكنة ثابتة: الذهبي يحتاج خلفية غامقة ليبقى مقروءاً في الوضعين -->
  <rect width="64" height="64" rx="15" fill="#16130f" />

  <!-- ثلاث درجات صاعدة: النمو والخروج من الدين -->
  <g fill="url(#albasha-gold)">
    <rect x="14" y="27" width="11.5" height="8" rx="1.8" />
    <rect x="26.25" y="20" width="11.5" height="15" rx="1.8" />
    <rect x="38.5" y="12" width="11.5" height="23" rx="1.8" />
  </g>

  <!-- كتاب مفتوح -->
  <path d="M31 42.5c-5.2-3.6-11.4-4.9-18.5-4.1v11.7c7.1-.8 13.3.5 18.5 4.1z" fill="#efe7d8" />
  <path d="M33 42.5c5.2-3.6 11.4-4.9 18.5-4.1v11.7c-7.1-.8-13.3.5-18.5 4.1z" fill="#cec3ac" />
</svg>
