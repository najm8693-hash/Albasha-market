name: نشر الموقع على GitHub Pages

on:
  push:
    branches: [main]
  # يسمح بتشغيل النشر يدوياً من تبويب Actions.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# نشر واحد في كل مرة، بلا إلغاء نشرة جارية.
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: نشر
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: جلب الشيفرة
        uses: actions/checkout@v4

      # تتطلّب أن تكون Pages مفعّلة مسبقاً من Settings ← Pages ← Source: GitHub Actions.
      # لا يمكن أتمتة التفعيل: إنشاء موقع Pages عبر الـ API يحتاج صلاحية admin،
      # و GITHUB_TOKEN سقفه write — لذا enablement: true يفشل قبل التفعيل اليدوي.
      - name: تهيئة GitHub Pages
        uses: actions/configure-pages@v5

      # الموقع ملفات ثابتة في جذر المستودع — بلا خطوة بناء.
      - name: رفع ملفات الموقع
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: النشر
        id: deployment
        uses: actions/deploy-pages@v4
