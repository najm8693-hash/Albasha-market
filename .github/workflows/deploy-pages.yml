name: نشر الموقع على GitHub Pages

# صفحات GitHub مضبوطة على النشر من فرع gh-pages، وهذا السير يبقيه نسخة طبق
# الأصل من main. فأي دفع إلى main ينشر نفسه خلال أقل من دقيقة.
on:
  push:
    branches: [main]
  # يسمح بإعادة النشر يدوياً من تبويب Actions.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    name: تحديث فرع gh-pages
    runs-on: ubuntu-latest
    steps:
      - name: جلب الشيفرة
        uses: actions/checkout@v4

      # gh-pages فرع مولَّد آلياً لا يُعدَّل يدوياً، فالكتابة فوقه هي السلوك
      # الصحيح: يبقى مطابقاً لـ main مهما جرى على تاريخه.
      - name: مزامنة gh-pages مع main
        run: git push --force origin HEAD:gh-pages
